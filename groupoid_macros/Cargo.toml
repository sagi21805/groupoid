[package]
name = "groupoid_macros"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Procedural macros powering the groupoid crate"
keywords = ["typestate", "proc-macro", "groupoid"]
categories = ["rust-patterns", "development-tools::procedural-macro-helpers"]
readme = "../README.md"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.5", features = ["full", "extra-traits"] }

[dev-dependencies]
trybuild = "1.0.121"
pollster = "1.0.1"
groupoid = { path = "../groupoid" }
