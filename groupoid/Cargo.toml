[package]
name = "groupoid"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Typestate based grouping types for Rust"
keywords = ["typestate", "state-machine", "groupoid", "type"]
categories = ["rust-patterns", "data-structures"]
readme = "../README.md"

[features]
default = ["std"]
# `Morph` impls for `core` types.
core = []
# `Morph` impls for `alloc` collections and `Box`.
alloc = ["core"]
# `Morph` impls for `HashMap` and `HashSet`.
std = ["alloc"]

[dependencies]
groupoid_macros = { path = "../groupoid_macros", version = "0.1.1" }
